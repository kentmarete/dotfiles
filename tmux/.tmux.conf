# ~/.tmux.conf — prefix is Ctrl-a. Reload: prefix r. Install plugins: prefix I
# Ctrl-h/j/k/l moves between tmux panes AND vim splits (vim-tmux-navigator).

# --- Prefix ---------------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix              # Ctrl-a Ctrl-a sends a literal Ctrl-a (line start)

# --- General -------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,xterm-ghostty:RGB"
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10            # no lag on <Esc> in vim
set -g focus-events on
set -g display-time 2000
set -g status-position top
setw -g mode-keys vi

bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# --- Panes ------------------------------------------------------------------------
# prefix h/j/k/l also works (in addition to the Ctrl-h/j/k/l no-prefix bindings)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
# Splits & new windows open in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# --- Windows / sessions -------------------------------------------------------
bind -n M-Left  previous-window   # Option-←/→ (Ghostty: macos-option-as-alt)
bind -n M-Right next-window
bind Tab last-window
bind S choose-tree -sZ            # session picker
bind P display-popup -E -w 80% -h 60% "cproj"        # fuzzy project launcher
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"
bind D run-shell "devdash"        # developer dashboard window

# --- Copy mode (vi keys, macOS clipboard) ------------------------------------
set -g set-clipboard on
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# --- Plugins (TPM) ------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'    # prefix Ctrl-s save / Ctrl-r restore
set -g @plugin 'tmux-plugins/tmux-continuum'    # auto-save every 15 min, auto-restore
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'

set -g @resurrect-strategy-vim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'

run '~/.tmux/plugins/tpm/tpm'

# Status line (must come after the catppuccin plugin has loaded)
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_directory}#{E:@catppuccin_status_session}"

# Machine-local overrides
if-shell "test -f ~/.tmux.local.conf" "source-file ~/.tmux.local.conf"
